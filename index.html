<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チェックシート</title>
  <meta name="description" content="ゲームの回収状況チェックシート（プロジェクトセカイ / マイセカイチェックリストなど）">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span id="site-title">チェックシート</span>
      </a>
      <button id="edit-toggle" class="btn btn-ghost" type="button">編集</button>
    </div>
    <nav class="wrap crumbs" id="crumbs" aria-label="現在地"></nav>
    <nav class="wrap tabs" id="tabs" aria-label="同じカテゴリのページ" hidden></nav>
  </header>

  <main class="wrap" id="view" aria-live="polite">
    <p class="loading">読み込み中…</p>
  </main>

  <footer class="wrap site-footer" id="footer"></footer>

  <div class="savebar" id="savebar" hidden>
    <div class="wrap savebar-row">
      <span id="savebar-text"></span>
      <span class="savebar-actions">
        <button class="btn btn-ghost" id="discard-btn" type="button">破棄</button>
        <button class="btn btn-primary" id="save-btn" type="button">GitHub に保存</button>
      </span>
    </div>
  </div>

  <dialog id="edit-dialog">
    <form method="dialog" id="edit-form">
      <h2>編集モード</h2>
      <p class="muted small">
        編集は、このリポジトリへの書き込み権限を持つ GitHub トークンを持っている人だけができます。
        トークンはこのブラウザ内（localStorage）にのみ保存され、GitHub API 以外には送信されません。
      </p>
      <label>リポジトリ所有者 <input name="owner" required autocomplete="off"></label>
      <label>リポジトリ名 <input name="repo" required autocomplete="off"></label>
      <label>ブランチ <input name="branch" required autocomplete="off"></label>
      <label>Fine-grained トークン（Contents: Read and write）
        <input name="token" type="password" required autocomplete="off" placeholder="github_pat_...">
      </label>
      <p class="error small" id="edit-error" hidden></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" value="logout" id="logout-btn" type="submit" formnovalidate>トークンを削除</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost" value="cancel" type="submit" formnovalidate>閉じる</button>
        <button class="btn btn-primary" value="ok" type="submit">接続</button>
      </div>
      <details class="small muted">
        <summary>オフラインで編集したい場合</summary>
        <p>下のボタンで、現在のチェック状態を <code>progress.json</code> としてダウンロードできます。
          リポジトリの <code>data/progress.json</code> を置き換えてコミットすれば反映されます。</p>
        <button class="btn btn-ghost" type="button" id="download-btn">progress.json をダウンロード</button>
      </details>
    </form>
  </dialog>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
